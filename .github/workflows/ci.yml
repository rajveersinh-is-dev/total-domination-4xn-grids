name: CI Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov black flake8 mypy pylint bandit

      - name: Run Black
        run: black --check .

      - name: Run Flake8
        run: flake8 .

      - name: Run MyPy
        run: mypy .

      - name: Run Bandit
        run: bandit -r src/

      - name: Run Pylint
        run: PYTHONPATH=. pylint src tests experiments

      - name: Test and Coverage
        run: |
          PYTHONPATH=. pytest --cov=src --cov-report=term-missing tests

      - name: Verify Formula
        run: |
          python -m src.verify_formula
